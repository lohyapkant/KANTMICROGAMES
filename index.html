<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Fits phone screens and stops pinch-zoom mischief during a scurry. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFF3E2">
    <title>KANT MICRO — tiny pixel games in one file</title>
    <style>
        /*
           ============================================================
           KANTMICROGAME — ONE FILE (since build 002-20261031).
           The shelf AND every game live inside this single HTML file:
             * two screens — the shelf, and the currently open game —
               swap inside the page (no navigation, no iframes, no folders)
             * one shared stage canvas + one shared input layer; every
               game is a self-contained module (own IIFE, own SETTINGS)
             * one file, fully offline, no web fonts, no network
             * pixel art everywhere inside the stage; system fonts outside
           ============================================================
        */

        :root {
            --cream:      #FFF3E2;
            --cream-deep: #FFE8CC;
            --panel:      #FFFDF8;
            --ink:        #4A3B32;
            --ink-soft:   #8A776A;
            --outline:    #E8D8C2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { height: 100%; }

        [hidden] { display: none !important; }

        body {
            min-height: 100dvh; /* iPhone Safari: true screen height while the address bar moves */
            overflow-x: hidden;
            color: var(--ink);
            font-family: -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(circle at 15% -10%, #FFEFD8 0%, transparent 34%),
                radial-gradient(circle at 88% 4%, #FDE4EA 0%, transparent 30%),
                linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
            user-select: none;
            -webkit-user-select: none;
        }

        #page {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 0px) + 20px) 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
        }

        /* =============== shelf screen =============== */

        #banner { display: flex; align-items: center; gap: 18px; max-width: 640px; margin-bottom: 16px; }

        #mascot {
            display: block;
            width: 96px;    /* 16 design-pixels wide, x6, crisp */
            height: 90px;   /* 15 design-pixels tall            */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #bannerText h1 {
            font-size: clamp(30px, 8vw, 44px);
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 0.95;
            text-shadow: 0 3px 0 rgba(74, 59, 50, 0.08);
        }

        #bannerText .tagline {
            margin-top: 9px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-soft);
        }

        #howto {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 640px;
            margin-bottom: 20px;
        }

        .chip {
            display: inline-flex;
            align-items: baseline;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--outline);
            box-shadow: 0 4px 10px rgba(74, 59, 50, 0.06);
            font-size: 12.5px;
            font-weight: 800;
            font-style: normal;
        }

        .chip i { font-style: normal; color: var(--ink-soft); font-size: 11px; letter-spacing: 0.5px; }
        .chip b { font-size: 15px; }
        .chip.pulse b { animation: pulse 0.3s ease; }

        @keyframes pulse {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        #shelf {
            width: 100%;
            max-width: 760px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
            gap: 16px;
        }

        .card {
            position: relative;
            display: block;
            padding: 18px 18px 15px;
            border-radius: 22px;
            background: var(--panel);
            border: 1px solid var(--outline);
            box-shadow: 0 10px 24px rgba(74, 59, 50, 0.10);
            text-decoration: none;
            color: var(--ink);
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.16s ease;
        }

        .card:hover { transform: translateY(-4px) rotate(-0.5deg); }

        .card .preview {
            display: block;
            width: 100%;
            height: 96px;
            border-radius: 14px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #FFF6E4;
            border: 1px dashed var(--outline);
            margin-bottom: 13px;
        }

        .card .name { font-size: 17px; font-weight: 800; }
        .card .concept { margin-top: 6px; font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--ink-soft); }
        .card .best { margin-top: 11px; font-size: 12px; font-weight: 800; }
        .card .best::before { content: "★ "; color: #E9A93D; }

        .card.soon { border: 2px dashed #D9C7B2; background: rgba(255, 253, 248, 0.65); box-shadow: none; cursor: default; }
        .card.soon:hover { transform: none; }
        .card.soon .name { color: var(--ink-soft); }

        .soonRow { display: flex; align-items: center; gap: 14px; }
        #soonMoon { flex: none; width: 56px; height: 56px; image-rendering: pixelated; image-rendering: crisp-edges; }

        /* =============== game screen =============== */

        .gameTop { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 12px; width: 100%; max-width: 720px; }

        .topRow { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }

        .pill {
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid var(--outline);
            background: var(--panel);
            box-shadow: 0 4px 0 rgba(74, 59, 50, 0.12);
            font-family: inherit;
            font-weight: 800;
            font-size: 13px;
            color: var(--ink);
            cursor: pointer;
            touch-action: none;
        }

        .pill.press { transform: translateY(3px); box-shadow: 0 1px 0 rgba(74, 59, 50, 0.12); }

        #gameTitle {
            font-size: clamp(24px, 6.5vw, 36px);
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 3px 0 rgba(74, 59, 50, 0.08);
            text-align: center;
        }

        #gameTagline { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-align: center; }

        #arena { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }

        @media (min-width: 680px) {
            #arena { flex-direction: row; align-items: center; gap: 34px; }
        }

        #stageBlock { display: flex; flex-direction: column; align-items: center; min-width: 0; }

        #bezel {
            padding: 12px;
            border-radius: 24px;
            background: var(--panel);
            border: 1px solid var(--outline);
            box-shadow: 0 12px 26px rgba(74, 59, 50, 0.12), 0 3px 0 rgba(74, 59, 50, 0.05);
            max-width: 100%;
        }

        #stage {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border-radius: 10px;
        }

        #msg {
            margin-top: 11px;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--ink-soft);
            text-align: center;
            letter-spacing: 0.3px;
        }

        #controls { display: flex; flex-direction: column; align-items: center; gap: 13px; touch-action: none; }

        #pad {
            display: grid;
            grid-template-columns: 58px 58px 58px;
            grid-template-rows: 58px 58px 58px;
            gap: 9px;
            grid-template-areas:
                ".      up    ."
                "left   dash  right"
                ".      down  .";
        }

        .pbtn {
            border: 0;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 800;
            font-size: 19px;
            color: #4A3B32;
            box-shadow: 0 5px 0 var(--btn-shade, #D9C7B2), 0 8px 14px rgba(74, 59, 50, 0.10);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            touch-action: none;
            cursor: pointer;
        }

        .pbtn.press {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--btn-shade, #D9C7B2), 0 3px 8px rgba(74, 59, 50, 0.08);
        }

        #pUp    { grid-area: up;    background: #E2F3E6; --btn-shade: #A9CBB1; }
        #pLeft  { grid-area: left;  background: #E4F1FA; --btn-shade: #A9C8DC; }
        #pDash  { grid-area: dash;  background: #FFE5C5; --btn-shade: #DBB07E; font-size: 13px; letter-spacing: 0.5px; }
        #pRight { grid-area: right; background: #FCE4ED; --btn-shade: #DFAEC3; }
        #pDown  { grid-area: down;  background: #FFF2D6; --btn-shade: #DFC386; }

        #btnRestart {
            padding: 11px 24px;
            border-radius: 999px;
            border: 1px solid var(--outline);
            background: var(--panel);
            box-shadow: 0 4px 0 rgba(74, 59, 50, 0.12);
            font-family: inherit;
            font-weight: 800;
            font-size: 13px;
            color: var(--ink);
            cursor: pointer;
            touch-action: none;
        }

        #btnRestart.press { transform: translateY(3px); box-shadow: 0 1px 0 rgba(74, 59, 50, 0.12); }

        .hint { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); text-align: center; }

        /* =============== footer =============== */

        #meta {
            margin-top: auto;
            padding-top: 24px;
            text-align: center;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink-soft);
        }

        #meta .v {
            display: inline-block;
            margin-bottom: 7px;
            padding: 4px 11px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--outline);
            font-weight: 800;
            color: var(--ink);
        }

        .zzz { font-weight: 800; color: #E9A93D; letter-spacing: 1px; }

        @media (max-width: 420px) {
            #banner { gap: 12px; }
            #mascot { width: 80px; height: 75px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .card:hover, .chip.pulse b { animation: none; transition: none; transform: none; }
        }
    </style>
</head>
<body>
<div id="page">

    <!-- =============== the shelf screen (home) =============== -->
    <section id="shelfScreen">
        <header id="banner">
            <div><canvas id="mascot" width="16" height="15" aria-label="A pixel-art panda mascot, bobbing and blinking"></canvas></div>
            <div id="bannerText">
                <h1>KANT MICRO</h1>
                <p class="tagline">tiny pixel games — pick one, smile, play a minute</p>
            </div>
        </header>

        <nav id="howto" aria-label="How to play the games">
            <span class="chip"><i>⌨</i> WASD to move</span>
            <span class="chip"><i>⎵</i> SPACE for the action</span>
            <span class="chip"><i>📱</i> on-screen pads on phone</span>
            <span class="chip"><i>✓</i> no ads, no accounts</span>
        </nav>

        <main id="shelf" aria-label="Micro games"></main>
    </section>

    <!-- =============== the game screen (one shared stage + pads) =============== -->
    <section id="gameScreen" hidden>
        <div class="gameTop">
            <div class="topRow">
                <button id="btnBack" class="pill" aria-label="Back to the shelf">⌂ SHELF</button>
            </div>
            <h2 id="gameTitle"></h2>
            <p id="gameTagline"></p>
            <div class="topRow">
                <span class="chip"><i>SCORE</i><b id="scoreVal">0</b></span>
                <span class="chip"><i>★ BEST</i><b id="bestVal">0</b></span>
            </div>
        </div>

        <main id="arena">
            <section id="stageBlock">
                <div id="bezel">
                    <canvas id="stage" width="100" height="100"
                            aria-label="The tiny game stage"></canvas>
                </div>
                <p id="msg"></p>
            </section>

            <section id="controls">
                <div id="pad">
                    <button id="pUp"     class="pbtn" data-dir="up"    aria-label="Move up (W)">↑</button>
                    <button id="pLeft"   class="pbtn" data-dir="left"  aria-label="Move left (A)">←</button>
                    <button id="pDash"   class="pbtn" aria-label="Action button (SPACE)">DASH</button>
                    <button id="pRight"  class="pbtn" data-dir="right" aria-label="Move right (D)">→</button>
                    <button id="pDown"   class="pbtn" data-dir="down"   aria-label="Move down (S)">↓</button>
                </div>
                <button id="btnRestart">RESTART · R</button>
                <p class="hint" id="inputHint"></p>
            </section>
        </main>
    </section>

    <footer id="meta">
        <span class="v" id="verBox">KANT MICRO</span>
        <br><span class="zzz">one file</span> · runs completely offline · every game lives inside this page ·
        <span class="zzz">build 006-20261101</span>
    </footer>
</div>

<script>
"use strict";

/* ==================================================================
   READ ME FIRST — BOUNDARIES BETWEEN THE SHELF, THE RUNTIME AND THE
   THREE GAME MODULES (PANDASNACK, BOOPEEK, DUCKLINE).

   The shelf and the runtime are SHARED. The games are NOT shared.
   Each game is its own IIFE with its own SETTINGS, palette, sprite
   maps, state and drawing helpers. The only legal handshake between a
   game and the app is the module contract (see PART 5).

   RULES FOR FUTURE MODELS / LLMs — please respect these:
   1. Never read or write another game's private names. A name that
      lives inside one IIFE must never be referenced from another.
   2. A game may use ONLY: the module contract, the PART 1 pixel
      helpers (paintPixels / paintRoundBlob / paintEyes / pixel font /
      paintPixelText), readBest / saveBest, and the shared chrome
      handles scoreEl / bestEl / msgEl.
   3. Prefix every private name with the game's own prefix:
      PANDASNACK -> panda / PAL / PANDA_*, BOOPEEK -> peek / boo / pip /
      BOO_ / PIP_*, DUCKLINE -> duck / mama / DUCK_*.
   4. Paint with the ctx passed into paint(ctx). Do not assume the
      shared stageCtx; that assumption is a PANDASNACK legacy only.
   5. Do not copy one game's character art into another game. Panda,
      mouse and mallard shapes must stay visually distinct.
   6. PANDASNACK (content 001-20261031) is FROZEN by owner request:
      do not restyle, rebalance or refactor it unless the owner asks.
   7. Add a new game as a NEW IIFE registered in GAMES; never graft a
      new game into an existing module.
   ================================================================== */

/* ==================================================================
   PART 0 — file settings and the shared storage helpers
   ================================================================== */

/* ==================================================================
   BUILD NUMBERING AND RECORD-KEEPING — READ BEFORE BUMPING A BUILD.

   Build IDs use:  <NNN>-<YYYYMMDD>
     * NNN      = zero-padded, project-wide build number (000, 001, ...).
                  It only ever goes up; never reuse a number.
     * YYYYMMDD = the date the build was finished (2026-11-01 ->
                  20261101), kept as a human hint, not as the identity.
   Sorting the strings alphabetically therefore sorts them by build.

   A game module carries its own versionNumber: the build whose content
   it last changed in. A refactor that keeps a game's art and numbers
   identical does NOT change that game's number (PANDASNACK has stayed
   001-20261031 since round 1; DUCKLINE is frozen at 005-20261101).

   Every finished build records, in FOUR homes — this file's header or
   comments, README.md, CHANGELOG.md and the build's prompt copy — plus
   the plan's tool log:
     * the full model name and tool,
     * the effort/round summary,
     * the duration taken,
     * the token count.
   The owner's standing request; keep it exact and keep it honest.
   Owner observations about model strengths are dated entries in
   MODELS.md — add a new dated line, never rewrite an old one.
   ================================================================== */

const APP = {
    name: "KANT MICRO",
    fileVersion: "006-20261101",       // build number of THIS one-file app
    savePrefix: "KANTMICROGAME."       // best scores live at prefix + GAMEID + ".best"
};

function readBest(gameId) {
    try {
        const value = window.localStorage.getItem(APP.savePrefix + gameId + ".best");
        const parsed = value === null ? 0 : parseInt(value, 10);
        return Number.isFinite(parsed) ? parsed : 0;
    } catch (error) {
        return 0;     // private browsing: saving skips, the game still runs
    }
}

function saveBest(gameId, value) {
    try {
        window.localStorage.setItem(APP.savePrefix + gameId + ".best", String(value));
    } catch (error) {
        /* saving quietly refused; the run itself is unaffected */
    }
}

/* ==================================================================
   PART 1 — the shared pixel-art helpers (defined once, used by the
   shelf mascot, every card preview and every game)
   ================================================================== */

/* paint a string map: equal-width rows; each letter is a color from
   `colors`; "." is transparent; optional scale and horizontal flip */
function paintPixels(ctx, map, colors, dx, dy, flipX, scale) {
    const s = scale || 1;
    const fx = Math.round(dx), fy = Math.round(dy);
    for (let y = 0; y < map.length; y++) {
        const row = map[y];
        for (let x = 0; x < row.length; x++) {
            const color = colors[row[x]];
            if (!color) continue;
            const drawX = flipX ? (fx + (row.length - 1 - x) * s) : (fx + x * s);
            ctx.fillStyle = color;
            ctx.fillRect(drawX, fy + y * s, s, s);
        }
    }
}

/* a rounded rectangle of solid pixels, painted per-pixel so it never
   erases art underneath it */
function paintRoundBlob(ctx, px, py, w, h, color) {
    ctx.fillStyle = color;
    const X = Math.round(px), Y = Math.round(py);
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if ((x + y) <= 1 || (x + y) >= (w + h - 2) || (w - 1 - x + y) <= 1 || (x + h - 1 - y) <= 1) continue;
            ctx.fillRect(X + x, Y + y, 1, 1);
        }
    }
}

/* two chubby dark eye patches with shine pixels; blink = patches only */
function paintEyes(ctx, atX, atY, colors, blink) {
    ctx.fillStyle = colors.patch;
    ctx.fillRect(atX, atY, 3, 2);
    ctx.fillRect(atX + 6, atY, 3, 2);
    if (!blink) {
        ctx.fillStyle = colors.shine;
        ctx.fillRect(atX + 1, atY, 1, 1);
        ctx.fillRect(atX + 7, atY, 1, 1);
    } else {
        ctx.fillStyle = colors.patch;
        ctx.fillRect(atX, atY + 1, 3, 1);
        ctx.fillRect(atX + 6, atY + 1, 3, 1);
    }
}

/* the shared 3 x 5 pixel font (five rows of three characters each) */
const PIXEL_FONT = {
    A: ["010", "101", "111", "101", "101"],
    B: ["110", "101", "110", "101", "110"],
    C: ["011", "100", "100", "100", "011"],
    D: ["110", "101", "101", "101", "110"],
    E: ["111", "100", "110", "100", "111"],
    F: ["111", "100", "110", "100", "100"],
    G: ["011", "100", "101", "101", "011"],
    H: ["101", "101", "111", "101", "101"],
    I: ["111", "010", "010", "010", "111"],
    J: ["001", "001", "001", "101", "110"],
    K: ["101", "110", "100", "110", "101"],
    L: ["100", "100", "100", "100", "111"],
    M: ["101", "111", "111", "101", "101"],
    N: ["110", "101", "101", "101", "101"],
    O: ["010", "101", "101", "101", "010"],
    P: ["110", "101", "110", "100", "100"],
    Q: ["010", "101", "101", "011", "001"],
    R: ["110", "101", "110", "101", "101"],
    S: ["011", "100", "010", "001", "110"],
    T: ["111", "010", "010", "010", "010"],
    U: ["101", "101", "101", "101", "111"],
    V: ["101", "101", "101", "101", "010"],
    W: ["101", "101", "111", "111", "101"],
    X: ["101", "101", "010", "101", "101"],
    Y: ["101", "101", "010", "010", "010"],
    Z: ["111", "001", "010", "100", "111"],
    0: ["111", "101", "101", "101", "111"],
    1: ["010", "110", "010", "010", "111"],
    2: ["111", "001", "111", "100", "111"],
    3: ["111", "001", "111", "001", "111"],
    4: ["101", "101", "111", "001", "001"],
    5: ["111", "100", "111", "001", "111"],
    6: ["111", "100", "111", "101", "111"],
    7: ["111", "001", "001", "001", "001"],
    8: ["111", "101", "111", "101", "111"],
    9: ["111", "101", "111", "001", "111"],
    "!": ["010", "010", "010", "000", "010"],
    "?": ["111", "001", "010", "000", "010"],
    ".": ["000", "000", "000", "000", "010"],
    "-": ["000", "000", "111", "000", "000"],
    "+": ["000", "010", "111", "010", "000"],
    " ": ["000", "000", "000", "000", "000"]
};

function pixelTextWidth(text, scale) {
    return (text.length * 4 - 1) * scale;
}

/* paint centered pixel text; optional one-pixel-deep shadow pass */
function paintPixelText(ctx, text, cx, cy, colorName, shadowColorName, scale) {
    if (shadowColorName) {
        paintPixelLine(ctx, text, cx, cy + (scale || 1), shadowColorName, scale);
    }
    paintPixelLine(ctx, text, cx, cy, colorName, scale);
}

function paintPixelLine(ctx, text, cx, cy, colorName, scale) {
    const s = scale || 1;
    const width = pixelTextWidth(text, s);
    const ox = Math.round(cx - width / 2);
    const oy = Math.round(cy);
    for (let i = 0; i < text.length; i++) {
        const glyph = PIXEL_FONT[text[i]] || PIXEL_FONT[text[i].toUpperCase()] || PIXEL_FONT["?"];
        for (let gy = 0; gy < 5; gy++) {
            for (let gx = 0; gx < 3; gx++) {
                if (glyph[gy][gx] !== "1") continue;
                ctx.fillStyle = colorName;
                ctx.fillRect(ox + i * 4 * s + gx * s, oy + gy * s, s, s);
            }
        }
    }
}

/* ==================================================================
   PART 2 — the shelf mascot: a chubby pixel panda that bobs and blinks
   (the same face that grew up into the round 1 game's meadow)
   ================================================================== */

const PANDA_OPEN = [
    "..KK........KK..",
    ".KKKK......KKKK.",
    ".KKKK......KKKK.",
    "..KKKKKKKKKKKK..",
    ".KKWWWWWWWWWWKK.",
    ".KWWWWWWWWWWWWK.",
    "KWWWWWWWWWWWWWWK",
    "KWWKKKWWWWKKKWWK",
    "KWWKWKWWWWKWKWWK",
    "KWWWWWWWWWWWWWWK",
    "KWWPWWWWWWWWPWWK",
    "KWWWWWWMMWWWWWWK",
    ".KWWWWWWWWWWWWK.",
    ".KWWWWWWWWWWWWK.",
    "..KKKKKKKKKKKK.."
];

const PANDA_BLINK = PANDA_OPEN.map(function (row, y) {
    return y === 8 ? "KWWKKKWWWWKKKWWK" : row;
});

const PANDA_COLORS = {
    K: "#3B2F27",
    W: "#FFFFFF",
    P: "#F7A8B8",
    M: "#8A6247"

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        paintPixels(ctx, PANDA_OPEN, PANDA_COLORS, 0, 0);
        return;
    }
    let step = 0;
    function tick() {
        const bob = (step === 0 || step === 2) ? 1 : 0;
        paintPixels(ctx, step === 3 ? PANDA_BLINK : PANDA_OPEN, PANDA_COLORS, 0, bob);
        step = (step + 1) % 4;
    }
    tick();
    window.setInterval(tick, 560);
}

/* ==================================================================
   PART 4 — the app runtime: registry, screens, one shared stage,
   one shared input layer, one loop
   ================================================================== */

const GAMES = [];               // every game module pushes itself in here
const ACTIVE = { module: null };

const shelfScreenEl = document.getElementById("shelfScreen");
const gameScreenEl = document.getElementById("gameScreen");
const stageCanvas = document.getElementById("stage");
const stageCtx = stageCanvas.getContext("2d");
const scoreEl = document.getElementById("scoreVal");
const bestEl = document.getElementById("bestVal");
const msgEl = document.getElementById("msg");
const gameTitleEl = document.getElementById("gameTitle");
const gameTaglineEl = document.getElementById("gameTagline");
const inputHintEl = document.getElementById("inputHint");
const dashBtnEl = document.getElementById("pDash");
const verEl = document.getElementById("verBox");

const STAGE_SIZE = 100;

function openGame(gameId) {
    const module2 = GAMES.find(function (game) { return game.id === gameId; });
    if (!module2) return;
    if (ACTIVE.module && ACTIVE.module.id !== gameId) ACTIVE.module.stop();
    ACTIVE.module = module2;
    shelfScreenEl.hidden = true;
    gameScreenEl.hidden = false;
    gameTitleEl.textContent = module2.name;
    gameTaglineEl.textContent = module2.tagline;
    inputHintEl.textContent = module2.hint;
    dashBtnEl.textContent = module2.actionLabel;
    scoreEl.textContent = "0";
    bestEl.textContent = String(readBest(gameId));
    msgEl.textContent = "";
    ACTIVE.errorReported = false;
    module2.start();
    /* INPUT HYGIENE: a direction held while the previous screen closed can
       otherwise stay "on" inside the newly opened module. Clearing it through
       the contract keeps every module's private input object honest. */
    releaseAllDirs(module2);
    fitStage();
    setHash("game=" + gameId);
}

function openShelf() {
    releaseAllDirs(ACTIVE.module);
    if (ACTIVE.module) ACTIVE.module.stop();
    ACTIVE.module = null;
    gameScreenEl.hidden = true;
    shelfScreenEl.hidden = false;
    buildShelf();                     // fresh best-score lines on the cards
    setHash("");
}

function setHash(value) {
    try {
        window.location.hash = value;
    } catch (error) {
        /* some embedded browsers refuse hash writes; the pages still swap */
    }
}

function routeFromHash() {
    const match = /^#game=([A-Z0-9-]+)/.exec(window.location.hash || "");
    const wanted = match ? match[1] : null;
    if (wanted && (!ACTIVE.module || ACTIVE.module.id !== wanted)) openGame(wanted);
    if (!wanted && ACTIVE.module) openShelf();
}

window.addEventListener("hashchange", routeFromHash);

/* whole-number scaling: the same rule every build has always followed */
function fitStage() {
    if (gameScreenEl.hidden) return;
    const widthBudget = Math.min(window.innerWidth - 48, 660);
    const heightBudget = window.innerHeight - (window.innerWidth >= 680 ? 170 : 360);
    let scale = Math.floor(Math.min(widthBudget, heightBudget) / STAGE_SIZE);
    scale = Math.max(2, Math.min(6, scale));
    stageCanvas.style.width = (STAGE_SIZE * scale) + "px";
    stageCanvas.style.height = (STAGE_SIZE * scale) + "px";
}

window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", fitStage);

/* ---------- the one loop: only the open game ticks and paints ---------- */

const FRAME = { lastTime: performance.now() };

function frame(now) {
    let dt = (now - FRAME.lastTime) / 1000;
    FRAME.lastTime = now;
    if (dt > 0.25) dt = 0.25;
    if (ACTIVE.module) {
        try {
            ACTIVE.module.update(dt);
            stageCtx.clearRect(0, 0, stageCanvas.width, stageCanvas.height);
            ACTIVE.module.paint(stageCtx);
        } catch (error) {
            /* A broken game must never kill the shared loop, the shelf or the
               other two games. Report once per open, keep the app alive. */
            if (!ACTIVE.errorReported) {
                ACTIVE.errorReported = true;
                console.error("KANTMICROGAME module error:", error);
                msgEl.textContent = "the game hiccuped — press R to restart or ESC for the shelf";
            }
        }
    }
    window.requestAnimationFrame(frame);
}

/* ---------- shared keyboard ---------- */

const DIR_KEYS = {
    KeyW: "up",    ArrowUp: "up",
    KeyA: "left",  ArrowLeft: "left",
    KeyS: "down",  ArrowDown: "down",
    KeyD: "right", ArrowRight: "right"
};

function pressPadVisual(dir, on) {
    const el = document.getElementById("p" + dir.charAt(0).toUpperCase() + dir.slice(1));
    if (el) el.classList.toggle("press", !!on);
}

/* Release every direction on the shared pads. Used when a screen swaps so
   a held key or thumb never leaks into the next game. */
function clearPadVisuals() {
    ["up", "down", "left", "right"].forEach(function (dir) { pressPadVisual(dir, false); });
}

/* Release every direction inside the open module through the contract.
   This is the runtime's only legal way to touch a module's private input. */
function releaseAllDirs(module3) {
    if (!module3) return;
    ["up", "down", "left", "right"].forEach(function (dir) { module3.onDir(dir, false); });
    clearPadVisuals();
}

window.addEventListener("keydown", function (event) {
    if (!ACTIVE.module) return;
    const code = event.code;
    if (code === "Space" || code.indexOf("Arrow") === 0) event.preventDefault();
    if (event.repeat) return;
    const dir = DIR_KEYS[code];
    if (dir) { ACTIVE.module.onDir(dir, true); pressPadVisual(dir, true); return; }
    if (code === "Space") { ACTIVE.module.onAction(); return; }
    if (code === "Escape") { openShelf(); return; }
    if (code === "KeyR") { ACTIVE.module.restart(); return; }
    if (typeof ACTIVE.module.onAnyKey === "function") ACTIVE.module.onAnyKey();
});

window.addEventListener("keyup", function (event) {
    if (!ACTIVE.module) return;
    const dir = DIR_KEYS[event.code];
    if (dir) { ACTIVE.module.onDir(dir, false); pressPadVisual(dir, false); }
});

/* Losing focus (tab switch, phone call, pad stolen) can swallow the keyup.
   Release every direction so no character keeps swimming on its own. */
window.addEventListener("blur", function () { releaseAllDirs(ACTIVE.module); });

/* ---------- shared pads (they serve whichever game is open) ---------- */

function wirePad(id, onDown, onUp) {
    const el = document.getElementById(id);
    if (!el) return;
    const down = function (event) {
        event.preventDefault();
        el.classList.add("press");
        if (el.setPointerCapture && event.pointerId !== undefined) {
            try { el.setPointerCapture(event.pointerId); } catch (error) { /* fine */ }
        }
        if (onDown) onDown();
    };
    const up = function () {
        el.classList.remove("press");
        if (onUp) onUp();
    };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("lostpointercapture", up);
    el.addEventListener("contextmenu", function (event) { event.preventDefault(); });
    return el;
}

const releaseDirs = null; /* pads handle their own releases */

["Up", "Down", "Left", "Right"].forEach(function (edge) {
    const dir = edge.toLowerCase();
    wirePad("p" + edge,
        function () { if (ACTIVE.module) ACTIVE.module.onDir(dir, true); },
        function () { if (ACTIVE.module) ACTIVE.module.onDir(dir, false); });
});

wirePad("pDash", function () {
    if (!ACTIVE.module) return;
    ACTIVE.module.onAction();
});

wirePad("btnRestart", function () {
    if (ACTIVE.module) ACTIVE.module.restart();
});

wirePad("btnBack", function () { openShelf(); });

/* tapping the stage during play: the module decides what that means */
wirePad("stage", function () {
    if (ACTIVE.module) ACTIVE.module.onStageTap();
});

    ];
    const BAMBOO_COLORS = { D: PAL.bambooLeafTip, L: PAL.bambooLeaf, S: PAL.bambooStalk, s: PAL.bambooStalkRing };

    const WASP_A = [

    ];
    const WASP_B = [

    ];
    const WASP_COLORS = { K: PAL.waspDark, Y: PAL.waspYellow, W: PAL.waspWing, E: PAL.waspEye };

    const HEART_MAP = [".RR.RR.", "RWRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."];
    const HEART_FULL =  { R: PAL.heartFill,  W: PAL.heartShine };
    const HEART_EMPTY = { R: PAL.heartEmpty, W: PAL.heartShine };

    const SPARK_A = ["..Y..", "..Y..", "YYWYY", "..Y..", "..Y.."];
    const SPARK_B = [".....", "..Y..", ".YYY.", "..Y..", "....."];
    const SPARK_C = [".....", ".....", "..Y..", ".....", "....."];
    const SPARK_FRAMES = [SPARK_A, SPARK_B, SPARK_C];

    const LEAF_MAP = ["...G.", "..GG.", ".GGG.", ".GG..", "..G.."];
    const FLOWER_MAP = [".P.", "PCP", ".P."];

    /* ---------- state ---------- */

    const STATE = { TITLE: "title", PLAY: "play", OVER: "over" };
    let state = STATE.TITLE;
    let stateTime = 0;
    let score = 0;
    let hearts = SETTINGS.playerSettings.startingHearts;
    let storedBest = 0;
    let newBestFlag = false;

        x: 44, y: 58, walking: false, walkPhase: 0, leanDir: 0,
        blinkTimer: 2.2, blinking: false, blinkLeft: 0,
        chompT: 0, invulnT: 0, dashing: false, dashT: 0, dashReadyT: 0
    };

    let bamboo = [];
    let pendingBamboo = 0;
    let respawnTimers = [];
    let wasps = [];
    let sparkles = [];
    let waspSpawnTimer = 0;
    let waspWingFrame = 0;
    let clock = 0;
    let dustTimer = 0;
    let scoreChanged = false;

    const input = { up: false, down: false, left: false, right: false };

    /* ---------- world helpers ---------- */

    function difficultyBand() {
        for (const band of SETTINGS.difficultyBands) {
            if (band.untilScore === null || score <= band.untilScore) return band;
        }
        return SETTINGS.difficultyBands[SETTINGS.difficultyBands.length - 1];
    }

    function farEnoughFromThings(x, y) {
        const pandaCX = panda.x + 6, pandaCY = panda.y + 7;
        if (Math.hypot(x + 3 - pandaCX, y + 4 - pandaCY) < SETTINGS.worldSettings.minBambooDistanceFromPanda) return false;
        for (const other of bamboo) {
            if (Math.hypot(x + 3 - (other.x + 3), y + 4 - (other.y + 4)) < SETTINGS.worldSettings.minBambooDistanceFromBamboo) return false;
        }
        return true;
    }

        for (let attempt = 0; attempt < 40; attempt++) {
            const x = 4 + Math.floor(Math.random() * 84);
            const y = 18 + Math.floor(Math.random() * 68);
            if (farEnoughFromThings(x, y)) {
                bamboo.push({ x, y, sway: Math.floor(Math.random() * 2) });
                return;
            }
        }
        /* 40 polite tries and still no spot: skip quietly and try next respawn */
    }

    function spawnWasp() {
        const band = difficultyBand();
        if (wasps.length >= band.maxWasps) return;
        const fromLeft = Math.random() < 0.5;
        const speed = fromLeft ? band.waspSpeed : -band.waspSpeed;
        for (let attempt = 0; attempt < 10; attempt++) {
            const y = 6 + Math.random() * 78;
            const entryX = fromLeft ? -10 : SETTINGS.stageSize + 1;
            if (Math.abs(y - (panda.y + 7)) >= 18) {
                wasps.push({ x: entryX, baseY: y, vx: speed, phase: Math.random() * 6.28 });
                return;
            }
        }
    }

    function startRun() {
        score = 0;
        hearts = SETTINGS.playerSettings.startingHearts;
        panda.x = 44; panda.y = 58;
        panda.dashing = false; panda.dashT = 0; panda.dashReadyT = 0;
        panda.invulnT = 0; panda.chompT = 0; panda.blinking = false; panda.blinkTimer = 2.2;
        panda.walking = false; panda.leanDir = 0;
        bamboo = []; pendingBamboo = 0; respawnTimers = [];
        wasps = []; sparkles = [];
        waspSpawnTimer = SETTINGS.worldSettings.firstWaspSpawnDelaySeconds;
        for (let i = 0; i < SETTINGS.worldSettings.bambooShootsOnStage; i++) spawnBamboo();
        state = STATE.PLAY;
        stateTime = 0;
        syncChrome(true);
    }

    function finishRun() {
        const record = score > storedBest;
        if (record) {
            storedBest = score;
            saveBest(SETTINGS.gameName, score);
        }
        newBestFlag = record;
        state = STATE.OVER;
        stateTime = 0;
        syncChrome(true);
    }

    function waspY(wasp) {
        return Math.round(wasp.baseY + Math.sin(wasp.phase) * SETTINGS.worldSettings.waspWaveAmplitude);
    }

    function secondsPerWaspWing() { return 0.09; }

    function triggerDash() {
        if (state !== STATE.PLAY || panda.dashing || panda.dashReadyT > 0) return false;
        panda.dashing = true;
        panda.dashT = SETTINGS.playerSettings.dashSeconds;
        panda.dashReadyT = SETTINGS.playerSettings.dashCooldownSeconds;
        return true;
    }

    /* ---------- fixed-step world update ---------- */

    let accumulator = 0;
    const STEP_SECONDS = 1 / 60;

    function update(rawDt) {
        let dt = rawDt > 0.25 ? 0.25 : rawDt;
        accumulator += dt;
        let steps = 0;
        while (accumulator >= STEP_SECONDS && steps < 4) {
            stepWorld(STEP_SECONDS);
            accumulator -= STEP_SECONDS;
            steps++;
        }
        if (steps === 4) accumulator = 0;
    }

    function stepWorld(dt) {
        clock += dt;
        stateTime += dt;
        waspWingFrame = Math.floor(clock / secondsPerWaspWing()) % 2;

        updateSparkles(dt);
        if (state === STATE.TITLE) { updatePandaFace(dt, true); return; }
        if (state === STATE.OVER) return;

        updatePandaFace(dt, false);

        // the panda scurries
        const player = SETTINGS.playerSettings;
        const world = SETTINGS.worldSettings;
        const mx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        const my = (input.down ? 1 : 0) - (input.up ? 1 : 0);
        panda.walking = (mx !== 0 || my !== 0);
        let speed = player.moveSpeedDesignPixelsPerSecond * (panda.dashing ? player.dashSpeedMultiplier : 1);
        if (mx !== 0 && my !== 0) speed *= 0.7071;
        if (mx !== 0) panda.x += Math.sign(mx) * speed * dt;
        if (my !== 0) panda.y += Math.sign(my) * speed * dt;
        panda.x = Math.max(2, Math.min(SETTINGS.stageSize - 15, panda.x));
        panda.y = Math.max(3, Math.min(SETTINGS.stageSize - 19, panda.y));
        if (panda.walking) {
            panda.walkPhase += dt * 8;
            dustTimer -= dt;
            if (dustTimer <= 0) {
                dustTimer = 0.18;
                sparkles.push({ x: panda.x + 2 + Math.random() * 9, y: panda.y + 15, t: 0, life: 0.3,
                                colors: { Y: PAL.dustPuff, W: PAL.dustLight } });
            }
        }
        if (panda.dashing) {
            panda.dashT -= dt;
            if (panda.dashT <= 0) panda.dashing = false;
        } else if (panda.dashReadyT > 0) {
            panda.dashReadyT -= dt;
        }
        if (panda.invulnT > 0) panda.invulnT -= dt;
        if (panda.chompT > 0) panda.chompT -= dt;

        // munch a shoot standing close enough
        for (let i = bamboo.length - 1; i >= 0; i--) {
            const shoot = bamboo[i];
            const shootCX = shoot.x + 3, shootCY = shoot.y + 4;
            const pandaCX = panda.x + 6.5, pandaCY = panda.y + 7;
            if (Math.hypot(shootCX - pandaCX, shootCY - pandaCY) <= 8) {
                bamboo.splice(i, 1);
                score++;
                scoreChanged = true;
                panda.chompT = 0.45;
                for (let s = 0; s < 6; s++) {
                    sparkles.push({
                        x: shootCX - 2 + (Math.random() * 8 - 4), y: shootCY - 2 + (Math.random() * 8 - 4),
                        t: 0, life: 0.45, colors: { Y: PAL.sparkleGold, W: PAL.sparkleWhite }
                    });
                }
                respawnTimers.push(SETTINGS.worldSettings.bambooRespawnDelaySeconds);
            }
        }

        // the wasps drift, and may sting
        for (let i = wasps.length - 1; i >= 0; i--) {
            const wasp = wasps[i];
            wasp.x += wasp.vx * dt;
            wasp.phase += dt * (6.28 / world.waspWaveSeconds);
            const waspCY = waspY(wasp);
            if (wasp.x < -12 || wasp.x > SETTINGS.stageSize + 11) {
                wasps.splice(i, 1);
                continue;
            }
            if (panda.invulnT <= 0) {
                const pandaCX = panda.x + 6.5, pandaCY = panda.y + 7;
                const waspCX = wasp.x + 4.5;
                if (Math.hypot(waspCX - pandaCX, waspCY - pandaCY) <= world.waspHitRadius) {
                    hearts--;
                    scoreChanged = true;
                    panda.invulnT = player.secondsOfProtectionAfterHit;
                    for (let s = 0; s < 5; s++) {
                        sparkles.push({
                            x: pandaCX - 2 + (Math.random() * 8 - 4), y: pandaCY - 2 + (Math.random() * 8 - 4),
                            t: 0, life: 0.4, colors: { Y: PAL.owStar, W: PAL.sparkleWhite }
                        });
                    }
                    if (hearts <= 0) { finishRun(); return; }
                }
            }
        }

        for (let i = respawnTimers.length - 1; i >= 0; i--) {
            respawnTimers[i] -= dt;
            if (respawnTimers[i] <= 0) {
                respawnTimers.splice(i, 1);
                if (bamboo.length + pendingBamboo < world.bambooShootsOnStage) pendingBamboo++;
            }
        }
        if (pendingBamboo > 0 && bamboo.length < world.bambooShootsOnStage) {
            pendingBamboo--;
            spawnBamboo();
        }

        waspSpawnTimer -= dt;
        if (waspSpawnTimer <= 0) {
            waspSpawnTimer = band.waspSpawnEverySeconds;
            spawnWasp();
        }

        if (!sad) {
            ctx.fillStyle = PAL.pandaBlush;
            ctx.fillRect(px + 1, py + 6, 2, 1);

        ctx.fillRect(px + lean + 6, py + 5, 1, 1);

        const near = [];
        for (let i = 0; i < spots.length; i++) {
            if (i === booSpotIndex) continue;
            const d = Math.hypot(spots[i].x - here.x, spots[i].y - here.y);
            if (d <= WORLD.booSpotMaxJump) near.push(i);
        }
        const pool = near.length ? near : spots.map(function (_, i) { return i; })
            .filter(function (i) { return i !== booSpotIndex; });
        booSpotIndex = pool[Math.floor(Math.random() * pool.length)];
    }

    function booPopSparkles() {
        const spot = booSpot();
        const cx = spot.x + 6.5, cy = spot.y + 9;
        peekRings.push({ x: cx, y: cy, t: 0, life: 0.34 });
        for (let i = 0; i < 4; i++) {
            peekSparkles.push({
                x: cx - 3 + (Math.random() * 6 - 3),
                y: cy - 3 + (Math.random() * 6 - 3),
                t: 0, life: 0.38
            });
        }
    }

    function updateBooCycle(dt) {
        booPhaseT += dt;
        if (booPhaseT < booPhaseLen) return;
        booPhaseT = 0;
        if (booPhase === "hidden") {
            pickBooSpot();
            booPhase = "tell";
            booPhaseLen = PLAYER.peekTellSeconds;
        } else if (booPhase === "tell") {
            booPhase = "peek";
            booPhaseLen = PLAYER.peekVisibleMinSeconds +
                Math.random() * (PLAYER.peekVisibleMaxSeconds - PLAYER.peekVisibleMinSeconds);
            booPopSparkles();
        } else {
            booPhase = "hidden";
            booPhaseLen = PLAYER.peekHiddenMinSeconds +
                Math.random() * (PLAYER.peekHiddenMaxSeconds - PLAYER.peekHiddenMinSeconds);
        }
    }

    /* Boo floats, bobs and does a happy hop after a poke. */
    function ghostAnchor() {
        const spot = booSpot();
        const bob = Math.round(Math.sin(peekClock * 2.1) * 2);
        const hop = giggleT > 0
            ? -Math.round(Math.sin((1 - giggleT / PLAYER.wiggleSeconds) * Math.PI) * 2)
            : 0;
        return {
            x: spot.x,
            y: spot.y + bob + hop,
            cx: spot.x + 6.5,
            cy: spot.y + bob + hop + 9
        };
    }

    function triggerPoke() {
        if (peekState !== STATE.PLAY) return false;
        if (booPhase !== "peek") return false;
        if (peekClock - lastPokeAt < PLAYER.pokeCooldownSeconds) return false;
        const ghost = ghostAnchor();
        const dx = ghost.cx - (pip.x + 6.5);
        const dy = ghost.cy - (pip.y + 9);
        if (Math.hypot(dx, dy) > PLAYER.pokeReach) return false;

        lastPokeAt = peekClock;
        peekScore++;
        giggleT = PLAYER.wiggleSeconds;
        peekRings.push({ x: ghost.cx, y: ghost.cy, t: 0, life: 0.36 });
        for (let i = 0; i < 6; i++) {
            peekSparkles.push({
                x: ghost.cx - 2 + (Math.random() * 8 - 4),
                y: ghost.cy - 2 + (Math.random() * 8 - 4),
                t: 0, life: 0.45
            });
        }
        /* a short happy hop, then Boo vanishes and hides somewhere new */
        booPhase = "peek";
        booPhaseT = 0;
        booPhaseLen = PLAYER.pokePoofSeconds;
        syncChrome(true);
        return true;
    }

    /* ---------- BOOPEEK fixed-step update ---------- */

    function update(rawDt) {
        let dt = rawDt > 0.25 ? 0.25 : rawDt;
        accumulator += dt;
        let steps = 0;
        while (accumulator >= STEP_SECONDS && steps < 4) {
            stepWorld(STEP_SECONDS);
            accumulator -= STEP_SECONDS;
            steps++;
        }
        if (steps === 4) accumulator = 0;
    }

    function stepWorld(dt) {
        peekClock += dt;
        peekStateT += dt;
        updatePeekEffects(dt);
        if (peekState !== STATE.PLAY) return;

        const mx = (peekInput.right ? 1 : 0) - (peekInput.left ? 1 : 0);
        const my = (peekInput.down ? 1 : 0) - (peekInput.up ? 1 : 0);
        pip.walking = (mx !== 0 || my !== 0);
        if (pip.walking) pip.walkPhase = (pip.walkPhase + dt * 7) % 2;

        let speed = PLAYER.moveSpeedDesignPixelsPerSecond;
        if (mx !== 0 && my !== 0) speed *= 0.7071;
        if (mx !== 0) pip.x += Math.sign(mx) * speed * dt;
        if (my !== 0) pip.y += Math.sign(my) * speed * dt;
        /* Pip walks the nursery floor: keep him on the boards, never up the
           wallpaper, but free to roam down through the translucent HUD bar
           to reach Boo anywhere on the floor. */
        pip.x = Math.max(2, Math.min(STAGE - 14, pip.x));
        pip.y = Math.max(50, Math.min(STAGE - 19, pip.y));

        updatePipBlink(dt);
        updateGhostBlink(dt);
        updateBooCycle(dt);

        if (giggleT > 0) giggleT -= dt;
        peekRoundT += dt;
        if (peekRoundT >= SETTINGS.roundTimeLimitSeconds) {
            finishRun(peekScore >= PLAYER.goalPokes);
        }
    }

    function updatePipBlink(dt) {
        if (pip.blinkLeft > 0) {
            pip.blinkLeft -= dt;
            if (pip.blinkLeft <= 0) pip.blinking = false;
        } else {
            pip.blinkTimer -= dt;
            if (pip.blinkTimer <= 0) {
                pip.blinking = true;
                pip.blinkLeft = 0.14;
                pip.blinkTimer = 2.2 + Math.random() * 2.0;
            }
        }
    }

    function updateGhostBlink(dt) {
        if (ghostBlinkLeft > 0) {
            ghostBlinkLeft -= dt;
            if (ghostBlinkLeft <= 0) ghostBlinking = false;
        } else {
            ghostBlinkTimer -= dt;
            if (ghostBlinkTimer <= 0) {
                ghostBlinking = true;
                ghostBlinkLeft = 0.16;
                ghostBlinkTimer = 2.6 + Math.random() * 1.8;
            }
        }
    }

    function updatePeekEffects(dt) {
        for (let i = peekSparkles.length - 1; i >= 0; i--) {
            peekSparkles[i].t += dt;
            if (peekSparkles[i].t >= peekSparkles[i].life) peekSparkles.splice(i, 1);
        }
        for (let i = peekRings.length - 1; i >= 0; i--) {
            peekRings[i].t += dt;
            if (peekRings[i].t >= peekRings[i].life) peekRings.splice(i, 1);
        }
    }

    /* ---------- BOOPEEK painting (all on the passed ctx) ---------- */

    function drawRoom(ctx) {
        /* wallpaper: soft vertical stripes, never a checkerboard */
        for (let x = 0; x < STAGE; x += 8) {
            ctx.fillStyle = PAL.booWallA;
            ctx.fillRect(x, 0, 8, ROOM.floorY);
            ctx.fillStyle = PAL.booWallB;
            ctx.fillRect(x + 4, 0, 4, ROOM.floorY);
        }

        /* wainscot + floorboards */
        ctx.fillStyle = PAL.booWainscot;
        ctx.fillRect(0, 66, STAGE, 6);
        ctx.fillStyle = PAL.booFloorA;
        ctx.fillRect(0, ROOM.floorY, STAGE, STAGE - ROOM.floorY);
        for (let y = ROOM.floorY; y < STAGE; y += 7) {
            ctx.fillStyle = PAL.booFloorB;
            ctx.fillRect(0, y, STAGE, 3);
            ctx.fillStyle = PAL.booFloorLine;
            ctx.fillRect(0, y + 3, STAGE, 1);
        }
        ctx.fillStyle = PAL.booFloorLine;
        for (let i = 0; i < 7; i++) {
            ctx.fillRect((i * 19 + 5) % STAGE, ROOM.floorY + (i % 4) * 7, 1, 3);
        }

        /* moonlit window */
        const W = ROOM.window;
        ctx.fillStyle = PAL.booCupboardDark;
        ctx.fillRect(W.x - 2, W.y - 2, W.w + 4, W.h + 4);
        ctx.fillStyle = PAL.booWindow;
        ctx.fillRect(W.x, W.y, W.w, W.h);
        paintRoundBlob(ctx, W.x + 4, W.y + 4, 9, 9, PAL.booMoon);
        paintRoundBlob(ctx, W.x + 8, W.y + 2, 7, 7, PAL.booWindow);
        ctx.fillStyle = PAL.booStar;
        ctx.fillRect(W.x + 15, W.y + 6, 1, 1);
        ctx.fillRect(W.x + 18, W.y + 15, 1, 1);
        ctx.fillRect(W.x + 4, W.y + 20, 1, 1);
        ctx.fillStyle = PAL.booCupboardDark;
        ctx.fillRect(W.x + 11, W.y, 1, W.h);
        ctx.fillRect(W.x, W.y + 14, W.w, 1);
        ctx.fillStyle = PAL.booCupboardLight;
        ctx.fillRect(W.x - 3, W.y + W.h + 1, W.w + 6, 2);

        /* string lights */
        for (let x = 0; x <= STAGE; x += 2) {
            const y = Math.round(3 + Math.sin((x / STAGE) * Math.PI) * 5);
            ctx.fillStyle = PAL.booWainscot;
            ctx.fillRect(x, y, 2, 1);
        }
        const bulbs = [
            { x: 10, c: PAL.booGold }, { x: 26, c: PAL.booGhostBlush },
            { x: 42, c: PAL.booCap }, { x: 58, c: PAL.booGold },
            { x: 74, c: PAL.booGhostBlush }, { x: 90, c: PAL.booCap }
        ];
        for (const bulb of bulbs) {
            const y = Math.round(3 + Math.sin((bulb.x / STAGE) * Math.PI) * 5);
            ctx.fillStyle = bulb.c;
            ctx.fillRect(bulb.x - 1, y + 1, 3, 3);
            ctx.fillStyle = PAL.booStar;
            ctx.fillRect(bulb.x, y + 2, 1, 1);
        }

        /* framed heart */
        const F = ROOM.frame;
        ctx.fillStyle = PAL.booFrame;
        ctx.fillRect(F.x, F.y, F.w, F.h);
        ctx.fillStyle = PAL.booCupboardIn;
        ctx.fillRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
        paintPixels(ctx, [".PP.PP.", "PPPPPPP", ".PPPPP.", "..PPP..", "...P..."],
            { P: PAL.booRugLight }, F.x + 4, F.y + 3);

        /* wall clock */
        const C = ROOM.clock;
        paintRoundBlob(ctx, C.x, C.y, 9, 9, PAL.booFrame);
        paintRoundBlob(ctx, C.x + 1, C.y + 1, 7, 7, PAL.booText);
        ctx.fillStyle = PAL.booGhostDark;
        ctx.fillRect(C.x + 4, C.y + 2, 1, 3);
        ctx.fillRect(C.x + 4, C.y + 4, 3, 1);

        /* open cupboard where Boo lives */
        const K = ROOM.cupboard;
        ctx.fillStyle = PAL.booCupboard;
        ctx.fillRect(K.x, K.y, K.w, K.h);
        ctx.fillStyle = PAL.booCupboardLight;
        ctx.fillRect(K.x - 1, K.y - 3, K.w + 2, 3);
        ctx.fillStyle = PAL.booCupboardDark;
        ctx.fillRect(K.x + 1, K.y + K.h, 4, 2);
        ctx.fillRect(K.x + K.w - 5, K.y + K.h, 4, 2);
        ctx.fillStyle = PAL.booCupboardIn;
        ctx.fillRect(K.x + 3, K.y + 4, K.w - 6, K.h - 9);
        ctx.fillStyle = PAL.booCupboardLight;
        ctx.fillRect(K.x + 2, K.y + 3, 1, K.h - 7);
        ctx.fillRect(K.x + K.w - 3, K.y + 3, 1, K.h - 7);
        /* a tiny shelf and jar inside, so the cupboard feels lived in */
        ctx.fillStyle = PAL.booCupboardDark;
        ctx.fillRect(K.x + 4, K.y + 34, K.w - 8, 1);
        ctx.fillStyle = PAL.booCap;
        ctx.fillRect(K.x + 5, K.y + 31, 3, 3);
        ctx.fillStyle = PAL.booGold;
        ctx.fillRect(K.x + 20, K.y + 31, 2, 3);
        /* knobs */
        ctx.fillStyle = PAL.booGold;
        ctx.fillRect(K.x + 2, K.y + 24, 1, 2);
        ctx.fillRect(K.x + K.w - 3, K.y + 24, 1, 2);

        /* potted plant */
        ctx.fillStyle = PAL.booPot;
        ctx.fillRect(4, 66, 8, 6);
        ctx.fillStyle = PAL.booCupboardDark;
        ctx.fillRect(3, 65, 10, 2);
        paintRoundBlob(ctx, 2, 54, 6, 11, PAL.booPlant);
        paintRoundBlob(ctx, 7, 52, 5, 13, PAL.booPlantDark);
        paintRoundBlob(ctx, 0, 58, 4, 7, PAL.booPlant);

        /* rug, toy ball and book */
        paintRoundBlob(ctx, 26, 76, 40, 18, PAL.booRug);
        paintRoundBlob(ctx, 28, 78, 36, 14, PAL.booRugLight);
        paintRoundBlob(ctx, 30, 80, 32, 10, PAL.booRug);
        ctx.fillStyle = PAL.booRugTrim;
        for (let x = 28; x < 66; x += 3) ctx.fillRect(x, 93, 1, 2);
        paintRoundBlob(ctx, 17, 84, 6, 6, PAL.booGold);
        ctx.fillStyle = PAL.booRugLight;
        ctx.fillRect(19, 85, 2, 4);
        ctx.fillStyle = PAL.booCupboardLight;
        ctx.fillRect(67, 86, 9, 3);
        ctx.fillStyle = PAL.booRugTrim;
        ctx.fillRect(68, 87, 7, 1);
    }

    function drawBooTell(ctx) {
        const spot = booSpot();
        const cx = Math.round(spot.x + 6), cy = Math.round(spot.y + 8);
        const wide = Math.floor(peekClock * 12) % 2 === 0;
        const r = wide ? 3 : 2;
        ctx.fillStyle = PAL.booSparkle;
        ctx.fillRect(cx - r, cy, 1, 1);
        ctx.fillRect(cx + r, cy, 1, 1);
        ctx.fillRect(cx, cy - r, 1, 1);
        ctx.fillRect(cx, cy + r, 1, 1);
        ctx.fillStyle = PAL.booSparkleWhite;
        if (!wide) ctx.fillRect(cx, cy, 1, 1);
    }

    function drawGhost(ctx) {
        if (booPhase !== "peek") return;
        const g = ghostAnchor();
        /* soft contact shadow, kept right under Boo's hem (not on the floor) */
        paintRoundBlob(ctx, g.x + 2, g.y + 16, 9, 2, "rgba(20,16,40,0.32)");
        paintPixels(ctx, BOO_GHOST, BOO_COLORS, g.x, g.y);
        if (ghostBlinking) {
            ctx.fillStyle = PAL.booGhostWhite;
            ctx.fillRect(g.x + 2, g.y + 9, 3, 2);
            ctx.fillRect(g.x + 8, g.y + 9, 3, 2);
            ctx.fillStyle = PAL.booGhostDark;
            ctx.fillRect(g.x + 2, g.y + 9, 3, 1);
            ctx.fillRect(g.x + 8, g.y + 9, 3, 1);
        }
        if (giggleT > 0) {
            ctx.fillStyle = PAL.booSparkle;
            ctx.fillRect(g.x - 2, g.y + 4, 1, 1);
            ctx.fillRect(g.x + 14, g.y + 6, 1, 1);
        }
    }

    function drawPip(ctx) {
        const px = Math.round(pip.x);
        const py = Math.round(pip.y + (pip.walking ? (Math.floor(pip.walkPhase) % 2) : 0));
        const facingLeft = pip.leanDir < 0;
        /* keep the lantern on-stage even when Pip hugs a wall */
        let lanternSide = facingLeft ? -1 : 1;
        if (lanternSide > 0 && px + 18 > STAGE) lanternSide = -1;
        if (lanternSide < 0 && px - 4 < 0) lanternSide = 1;
        const lx = lanternSide > 0 ? px + 13 : px - 4;
        const ly = py + 7;

        ctx.fillStyle = "rgba(20,16,40,0.32)";
        paintRoundBlob(ctx, px + 2, py + 16, 9, 2, "rgba(20,16,40,0.32)");

        /* warm lantern light pools on the floorboards instead of hazing the wall */
        const flicker = Math.floor(peekClock * 8) % 2 === 0 ? 0 : 1;
        paintRoundBlob(ctx, px - 4 - flicker, py + 17, 22 + flicker * 2, 4,
            "rgba(255,210,100,0.22)");
        paintRoundBlob(ctx, px - 1, py + 18, 16, 3, "rgba(255,232,160,0.26)");

        paintPixels(ctx, PIP_MOUSE, PIP_COLORS, px, py, facingLeft);
        paintPixels(ctx, PIP_LANTERN, PIP_LANTERN_COLORS, lx, ly);

        if (pip.blinking) {
            ctx.fillStyle = PAL.pipFur;
            ctx.fillRect(px + 3, py + 6, 1, 1);
            ctx.fillRect(px + 9, py + 6, 1, 1);
            ctx.fillStyle = PAL.booGhostDark;
            ctx.fillRect(px + 3, py + 7, 1, 1);
            ctx.fillRect(px + 9, py + 7, 1, 1);
        }

        /* whiskers */
        ctx.fillStyle = PAL.pipFurShade;
        ctx.fillRect(px + (facingLeft ? 0 : 11), py + 9, 2, 1);
        ctx.fillRect(px + (facingLeft ? 1 : 10), py + 10, 2, 1);
    }

    function drawPeekEffects(ctx) {
        for (const sp of peekSparkles) {
            const idx = Math.max(0, Math.min(2, Math.floor((sp.t / sp.life) * 3)));
            const frame = BOO_SPARK_FRAMES[idx];
            for (let y = 0; y < 5; y++) {
                for (let x = 0; x < 5; x++) {
                    const ch = frame[y][x];
                    if (ch === ".") continue;
                    ctx.fillStyle = ch === "Y" ? PAL.booSparkle : PAL.booSparkleWhite;
                    ctx.fillRect(Math.round(sp.x) + x, Math.round(sp.y) + y, 1, 1);
                }
            }
        }
        for (const ring of peekRings) {
            const p = ring.t / ring.life;
            const radius = 2 + p * 7;
            const alpha = Math.max(0, 1 - p);
            ctx.fillStyle = "rgba(255,224,102," + alpha.toFixed(2) + ")";
            const steps = Math.round(radius);
            for (let i = -steps; i <= steps; i++) {
                const yy = Math.round(Math.sqrt(Math.max(0, radius * radius - i * i)));
                ctx.fillRect(Math.round(ring.x) + i, Math.round(ring.y) - yy, 1, 1);
                ctx.fillRect(Math.round(ring.x) + i, Math.round(ring.y) + yy, 1, 1);
            }
        }
    }

    function drawPeekPlate(ctx, y, h, alpha) {
        paintRoundBlob(ctx, 3, y, 94, h, "rgba(20,16,40," + (alpha || 0.62) + ")");
    }

    function paintPeekTitle(ctx) {
        drawPeekPlate(ctx, 8, 32, 0.80);
        paintPixelText(ctx, "BOOPEEK", 50, 13, PAL.booTextPink, PAL.booGhostDark, 2);
        paintPixelText(ctx, "POKE HIM WHEN HE POPS OUT", 50, 29, PAL.booText, null, 1);
        if (Math.floor(peekClock / 0.55) % 2 === 0) {
            drawPeekPlate(ctx, 80, 12, 0.72);
            paintPixelText(ctx, "PRESS ANY KEY OR TAP", 50, 84, PAL.booText, PAL.booGhostDark, 1);
        }
    }

    function paintPeekOver(ctx) {
        drawPeekPlate(ctx, 8, 38, 0.80);
        paintPixelText(ctx, peekWin ? "BOO! HEART FOUND" : "BOO! TIME IS UP", 50, 12,
            peekWin ? PAL.booTextPink : PAL.booText, PAL.booGhostDark, 1);
        paintPixelText(ctx, String(peekScore), 50, 22, PAL.booText, PAL.booGhostDark, 3);
        paintPixelText(ctx, "BEST " + peekBest, 50, 40, PAL.booText, null, 1);
        if (Math.floor(peekClock / 0.55) % 2 === 0) {
            drawPeekPlate(ctx, 80, 12, 0.72);
            paintPixelText(ctx, "PRESS ANY KEY OR TAP", 50, 84, PAL.booText, PAL.booGhostDark, 1);
        }
    }

    function paintPeekHud(ctx) {
        drawPeekPlate(ctx, 82, 15);
        paintPixelText(ctx, "BOO LOVE " + peekScore + "  GOAL " + PLAYER.goalPokes,
            50, 85, PAL.booTextPink, null, 1);
        paintPixelText(ctx, "TIME " + Math.max(0, Math.ceil(SETTINGS.roundTimeLimitSeconds - peekRoundT)),
            50, 92, PAL.booText, null, 1);
    }

    function paint(ctx) {
        drawRoom(ctx);
        if (booPhase === "tell") drawBooTell(ctx);
        drawGhost(ctx);
        drawPip(ctx);
        drawPeekEffects(ctx);
        if (peekState === STATE.TITLE) paintPeekTitle(ctx);
        else if (peekState === STATE.PLAY) paintPeekHud(ctx);
        else paintPeekOver(ctx);
    }

    /* ---------- BOOPEEK shelf card preview (private) ---------- */

    function paintBoopeekPreview(ctx) {
        ctx.fillStyle = PAL.booWallA;
        ctx.fillRect(0, 0, 200, 96);
        for (let x = 0; x < 200; x += 16) {
            ctx.fillStyle = PAL.booWallB;
            ctx.fillRect(x + 8, 0, 8, 96);
        }
        paintRoundBlob(ctx, 160, 8, 16, 16, PAL.booMoon);
        paintRoundBlob(ctx, 167, 5, 13, 13, PAL.booWallA);
        ctx.fillStyle = PAL.booStar;
        ctx.fillRect(140, 14, 2, 2);
        ctx.fillRect(184, 30, 2, 2);
        ctx.fillStyle = PAL.booFloorA;
        ctx.fillRect(0, 78, 200, 18);
        paintRoundBlob(ctx, 120, 76, 70, 14, PAL.booRug);
        paintRoundBlob(ctx, 126, 79, 58, 9, PAL.booRugLight);
        paintPixels(ctx, PIP_MOUSE, PIP_COLORS, 18, 30, false, 3);
        paintPixels(ctx, PIP_LANTERN, PIP_LANTERN_COLORS, 58, 54, false, 3);
        paintPixels(ctx, BOO_GHOST, BOO_COLORS, 122, 18, false, 4);
        paintPixels(ctx, BOO_SPARK_FRAMES[0], { Y: PAL.booSparkle, W: PAL.booSparkleWhite }, 102, 30, false, 3);
        paintPixels(ctx, BOO_SPARK_FRAMES[1], { Y: PAL.booSparkle, W: PAL.booSparkleWhite }, 176, 56, false, 3);
    }

    /* ---------- BOOPEEK chrome sync (shared chips, module-owned text) ---------- */

    let peekShownScore = null;
    let peekShownBest = null;
    let peekShownMsg = null;

    function syncChrome(force) {
        const shownBest = Math.max(peekBest, peekScore);
        if (force || peekShownScore !== peekScore) {
            peekShownScore = peekScore;
            scoreEl.textContent = String(peekScore);
        }
        if (force || peekShownBest !== shownBest) {
            peekShownBest = shownBest;
            bestEl.textContent = String(shownBest);
        }
        let msg;
        if (peekState === STATE.PLAY) msg = "Boo plays peek-a-boo — poke him when he pops out!";
        else if (peekState === STATE.TITLE) msg = "press any key or tap to start";
        else if (peekWin) msg = "boo! you beat the goal — try to beat your score!";
        else msg = "boo! time ran out — try again!";
        if (force || peekShownMsg !== msg) {
            peekShownMsg = msg;
            msgEl.textContent = msg;
        }
    }

    /* ---------- BOOPEEK module contract ---------- */

    function start() {
        peekBest = readBest(SETTINGS.gameName);
        peekState = STATE.TITLE;
        peekStateT = 0;
        peekScore = 0;
        peekRoundT = 0;
        pip.x = WORLD.startX;
        pip.y = WORLD.startY;
        pip.walking = false;
        pip.leanDir = 1;
        pip.walkPhase = 0;
        pip.blinking = false;
        pip.blinkLeft = 0;
        peekInput.up = false;
        peekInput.down = false;
        peekInput.left = false;
        peekInput.right = false;
        giggleT = 0;
        lastPokeAt = -99;
        peekSparkles = [];
        peekRings = [];
        accumulator = 0;
        syncChrome(true);
    }

    function stop() { /* nothing to release; the shared loop only ticks the open module */ }

    function restart() { startRun(); }

    function onDir(dir, pressed) {
        peekInput[dir] = !!pressed;
        if (pressed) {
            if (dir === "left") pip.leanDir = -1;
            else if (dir === "right") pip.leanDir = 1;
        }
    }

    function onAction() {
        if (peekState === STATE.PLAY) triggerPoke();
        else if (peekStateT > 0.35) startRun();
    }

    function onStageTap() { onAction(); }

    function onAnyKey() {

                    if (ch === ".") continue;
                    ctx.fillStyle = ch === "Y" ? PAL.duckSpark : PAL.duckWhite;
                    ctx.fillRect(Math.round(sp.x) + x, Math.round(sp.y) + y, 1, 1);
                }
            }
        }
    }

    function drawDuckPlate(ctx, y, h) {
        paintRoundBlob(ctx, 3, y, 94, h, "rgba(24,60,84,0.62)");
    }

    function paintDuckTitle(ctx) {
        drawDuckPlate(ctx, 8, 32);
        paintPixelText(ctx, "DUCKLINE", 50, 13, PAL.duckTextGold, PAL.duckEye, 2);
        paintPixelText(ctx, "LEAD THE FAMILY HOME", 50, 29, PAL.duckText, null, 1);
        if (Math.floor(duckClock / 0.55) % 2 === 0) {
            drawDuckPlate(ctx, 80, 12);
            paintPixelText(ctx, "PRESS ANY KEY OR TAP", 50, 84, PAL.duckText, PAL.duckEye, 1);
        }
    }

    function paintDuckOver(ctx) {
        drawDuckPlate(ctx, 8, 38);
        paintPixelText(ctx, duckWin ? "FAMILY COMPLETE" : "QUACK TIME IS UP", 50, 12,
            duckWin ? PAL.duckTextGold : PAL.duckText, PAL.duckEye, 1);
        paintPixelText(ctx, String(duckScore), 50, 22, PAL.duckText, PAL.duckEye, 3);
        paintPixelText(ctx, "DUCKLINGS " + duckCollected + " OF " + PLAYER.ducklingCount, 50, 40,
            PAL.duckTextPink, null, 1);
        if (Math.floor(duckClock / 0.55) % 2 === 0) {
            drawDuckPlate(ctx, 80, 12);
            paintPixelText(ctx, "PRESS ANY KEY OR TAP", 50, 84, PAL.duckText, PAL.duckEye, 1);
        }
    }

    function paintDuckHud(ctx) {
        drawDuckPlate(ctx, 82, 15);
        paintPixelText(ctx, "DUCKLINGS " + duckCollected + " OF " + PLAYER.ducklingCount,
            50, 85, PAL.duckTextGold, null, 1);
        paintPixelText(ctx, "TIME " + Math.max(0, Math.ceil(SETTINGS.roundTimeLimitSeconds - duckRoundT)),
            50, 92, PAL.duckText, null, 1);

        /* boost feather gauge, top-left over open water */
        const ready = duckBoostT > 0 || duckBoostReadyT <= 0;
        ctx.fillStyle = ready ? PAL.duckTextGold : "rgba(255,246,233,0.35)";
        ctx.fillRect(16, 4, 1, 3);
        ctx.fillRect(17, 3, 1, 5);
        ctx.fillRect(18, 4, 1, 3);
        paintRoundBlob(ctx, 21, 4, 14, 3, "rgba(24,60,84,0.55)");
        const fraction = duckBoostT > 0 ? 1 : (duckBoostReadyT <= 0 ? 1
            : 1 - duckBoostReadyT / PLAYER.boostCooldownSeconds);
        const fill = Math.round(12 * fraction);
        if (fill > 0) {
            ctx.fillStyle = ready ? PAL.duckTextGold : PAL.duckWaterLight;
            ctx.fillRect(22, 5, fill, 1);
        }
    }

    function paint(ctx) {
        drawPond(ctx);
        for (const duckling of ducklings) {
            if (duckling.collected) continue;
            const bob = Math.round(Math.sin(duckClock * 2.4 + duckling.bobPhase) * 1);
            drawDuckling(ctx, duckling, bob);
        }
        drawDuckEffects(ctx);
        drawMama(ctx);
        for (const duckling of duckLine) drawDuckling(ctx, duckling, 0);
        if (duckState === STATE.TITLE) paintDuckTitle(ctx);
        else if (duckState === STATE.PLAY) paintDuckHud(ctx);
        else paintDuckOver(ctx);
    }

    /* ---------- DUCKLINE shelf card preview (private) ---------- */

    function paintDuckLinePreview(ctx) {
        ctx.fillStyle = PAL.duckWaterMid;
        ctx.fillRect(0, 0, 200, 96);
        for (let y = 0; y < 96; y += 18) {
            ctx.fillStyle = PAL.duckWaterLight;
            for (let x = -20; x < 220; x += 40) ctx.fillRect(x + (y % 36), y + 6, 18, 2);
        }
        ctx.fillStyle = PAL.duckGrass;
        ctx.fillRect(0, 0, 16, 96);
        ctx.fillRect(184, 0, 16, 96);
        paintPixels(ctx, DUCK_LILY, DUCK_LILY_COLORS, 24, 66, false, 3);
        paintPixels(ctx, DUCK_LOTUS, DUCK_LOTUS_COLORS, 30, 60, false, 3);
        paintPixels(ctx, DUCK_BABY, DUCK_BABY_COLORS, 36, 62, false, 3);
        paintPixels(ctx, DUCK_BABY, DUCK_BABY_COLORS, 64, 50, false, 3);
        paintPixels(ctx, DUCK_BABY, DUCK_BABY_COLORS, 92, 40, false, 3);
        paintPixels(ctx, DUCK_MAMA, DUCK_MAMA_COLORS, 120, 22, false, 3);
        paintPixels(ctx, DUCK_DRAGONFLY, DUCK_DRAGONFLY_COLORS, 60, 12, false, 3);
        paintPixels(ctx, DUCK_FLOWER, DUCK_FLOWER_COLORS, 188, 20, false, 3);
        paintPixels(ctx, DUCK_FLOWER, DUCK_FLOWER_COLORS, 190, 70, false, 3);
    }

    /* ---------- DUCKLINE chrome sync (shared chips, module-owned text) ---------- */

    let duckShownScore = null;
    let duckShownBest = null;
    let duckShownMsg = null;

    function syncChrome(force) {
        const shownBest = Math.max(duckBest, duckScore);
        if (force || duckShownScore !== duckScore) {
            duckShownScore = duckScore;
            scoreEl.textContent = String(duckScore);
        }
        if (force || duckShownBest !== shownBest) {
            duckShownBest = shownBest;
            bestEl.textContent = String(shownBest);
        }
        let msg;
        if (duckState === STATE.PLAY) msg = "swim with WASD — collect the ducklings and reach the far bank!";
        else if (duckState === STATE.TITLE) msg = "press any key or tap to start";
        else if (duckWin && duckCollected >= PLAYER.ducklingCount) msg = "the whole family made it home!";
        else if (duckWin) msg = "some ducklings made it home — try for all three!";
        else msg = "quack! the sun set — try again!";
        if (force || duckShownMsg !== msg) {
            duckShownMsg = msg;
            msgEl.textContent = msg;
        }
    }

    /* ---------- DUCKLINE module contract ---------- */

    function start() {
        duckBest = readBest(SETTINGS.gameName);
        duckState = STATE.TITLE;
        duckStateT = 0;
        duckScore = 0;
        duckCollected = 0;
        duckRoundT = 0;
        duckBoostT = 0;
        duckBoostReadyT = 0;
        mama.x = WORLD.startX;
        mama.y = WORLD.startY;
        mama.dir = 1;
        mama.walking = false;
        mama.walkPhase = 0;
        ducklings = makeDucklings();
        duckLine = [];
        seedTrail();
        duckWakes = [];
        duckSparkles = [];
        duckInput.up = false;
        duckInput.down = false;
        duckInput.left = false;
        duckInput.right = false;
        accumulator = 0;
        syncChrome(true);
    }

    function stop() { /* nothing to release; the shared loop only ticks the open module */ }

    function restart() { startRun(); }

    function onDir(dir, pressed) {
        duckInput[dir] = !!pressed;
        if (pressed) {
            if (dir === "left") mama.dir = -1;
            else if (dir === "right") mama.dir = 1;
        }
    }

    function onAction() {
        if (duckState === STATE.PLAY) triggerBoost();
        else if (duckStateT > 0.35) startRun();
    }

    function onStageTap() { onAction(); }

    function onAnyKey() {
        if (duckState !== STATE.PLAY && duckStateT > 0.35) startRun();
    }

    GAMES.push({
        id: SETTINGS.gameName,
        versionNumber: SETTINGS.versionNumber,
        name: "Duck Line",
        tagline: "lead the ducklings home",
        concept: "Mama mallard swims across a sunny pond, collecting three ducklings into a waddling line before she reaches the far bank.",
        actionLabel: "GO",
        hint: "desktop: WASD swim · SPACE or tap stage to quack-boost · R restart · ESC shelf",
        previewPaint: paintDuckLinePreview,
        start, stop, restart,
        update, paint, onDir, onAction, onStageTap, onAnyKey
    });
})();


/* ==================================================================
   PART 6 — boot: stamp the version, build the shelf, wake the mascot,
   follow the hash, and start the one loop
   ================================================================== */

function boot() {
    verEl.textContent = APP.name + " — build " + APP.fileVersion;
    buildShelf();
    startMascot();
    routeFromHash();
    requestAnimationFrame(frame);
}

boot();

</script>
</body>
</html>
